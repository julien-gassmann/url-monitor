name: Get Scalingo Bearer Token

runs:
  using: "composite"
  steps:
    - name: Exchange token
      id: exchange
      shell: bash
      run: |
        TOKEN=$(curl -s -H "Accept: application/json" \
                     -H "Content-Type: application/json" \
                     -u ":${{ inputs.api_token }}" \
                     -X POST https://auth.scalingo.com/v1/tokens/exchange \
                     | jq -r '.token')
        echo "bearer=$TOKEN" >> $GITHUB_OUTPUT

inputs:
  api_token:
    description: "Scalingo API token"
    required: true

outputs:
  bearer:
    description: "Bearer token"
    value: ${{ steps.exchange.outputs.bearer }}