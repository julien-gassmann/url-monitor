name: Setup Scalingo SSH

runs:
  using: "composite"
  steps:
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh_key }}

    - name: Add Scalingo to known hosts
      run: ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts
      shell: bash

inputs:
  ssh_key:
    description: "Private SSH key used to connect to Scalingo"
    required: true