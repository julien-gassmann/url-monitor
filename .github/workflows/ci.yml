name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup app
        run: make setup CI=1

      - name: Run frontend checks
        run: make pnpm run test

      - name: Run tests
        run: make artisan test

      - name: Run parallel tests with coverage
        run: make composer test

  deploy:
    name: Deploy to Scalingo
    runs-on: ubuntu-latest
#    needs: tests  # Wait for tests to pass
#    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build MJML emails
        working-directory: backend
        run: |
          npm install -g mjml 
          npm run emails:build

      - name: Build Next.js
        working-directory: frontend
        run: |
          npm install -g pnpm
          pnpm install
          pnpm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SCALINGO_SSH_KEY }}

      - name: Add Scalingo to known hosts
        run: ssh-keyscan -H ssh.osc-fr1.scalingo.com >> ~/.ssh/known_hosts

      - name: Push to Scalingo
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.email "url@monitor.fr"
          git config --global user.name "URL MONITOR"
          git remote add scalingo git@ssh.osc-fr1.scalingo.com:url-monitor.git
          git add -f backend/resources/views/mails/*.blade.php
          git add -f frontend/.next/standalone
          git add -f frontend/.next/static
          git commit -m "chore: built assets for deploy" --allow-empty
          git push scalingo HEAD:refs/heads/main --force