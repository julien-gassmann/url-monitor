name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup app
        run: make setup CI=1

      - name: Run frontend checks
        run: make pnpm run test

      - name: Run tests
        run: make artisan test

      - name: Run parallel tests with coverage
        run: make composer test


  detect:
    name: Detect alive color
    runs-on: ubuntu-latest
#    needs: tests  # Wait for tests to pass
    outputs:
      alive: ${{ steps.set_outputs.outputs.alive }}
      target: ${{ steps.set_outputs.outputs.target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect alive backend
        id: detect_back
        run: |
          if curl -s --max-time 5 ${{ vars.BACK_BLUE_URL }}/api/health | grep -q '"status":"ok"'; then
            echo "alive=blue" >> $GITHUB_OUTPUT
          else
            echo "alive=green" >> $GITHUB_OUTPUT
          fi

      - name: Detect alive frontend
        id: detect_front
        run: |
          if curl -s --max-time 5 ${{ vars.FRONT_BLUE_URL }}/health | grep -q '"status":"ok"'; then
            echo "alive=blue" >> $GITHUB_OUTPUT
          else
            echo "alive=green" >> $GITHUB_OUTPUT
          fi
      

      - name: Set outputs
        id: set_outputs
        run: |
          BACK="${{ steps.detect_back.outputs.alive }}"
          FRONT="${{ steps.detect_front.outputs.alive }}"
          
          if [[ "$BACK" != "$FRONT" ]]; then
            echo "❌ État incohérent : back=$BACK, front=$FRONT"
            exit 1
          fi
          
          ALIVE="$BACK"
  
          if [[ "$ALIVE" == "blue" ]]; then
            TARGET="green"
          else
            TARGET="blue"
          fi
          
          echo "alive=$ALIVE" >> $GITHUB_OUTPUT
          echo "target=$TARGET" >> $GITHUB_OUTPUT



  deploy-back:
    name: Deploy backend to Scalingo
    runs-on: ubuntu-latest
    needs: detect
#    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build MJML emails
        working-directory: backend
        run: |
          npm install -g mjml 
          npm run emails:build

      - name: Setup Scalingo SSH
        uses: ./.github/actions/scalingo/setup-ssh
        with:
          ssh_key: ${{ secrets.SCALINGO_SSH_KEY }}

      - name: Push to Scalingo back-${{needs.detect.outputs.target}}
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.email "url@monitor.fr"
          git config --global user.name "URL MONITOR"
          git remote add scalingo git@ssh.osc-fr1.scalingo.com:url-monitor-back-${{needs.detect.outputs.target}}.git
          git fetch scalingo main || true
          git add -f backend/resources/views/mails/*.blade.php
          git commit --amend -m "chore: deploy $(date +%Y-%m-%d\ %H:%M)" --allow-empty
          git push scalingo HEAD:refs/heads/main --force



  deploy-front:
    name: Deploy frontend to Scalingo
    runs-on: ubuntu-latest
    needs: detect
#    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Scalingo SSH
        uses: ./.github/actions/scalingo/setup-ssh
        with:
          ssh_key: ${{ secrets.SCALINGO_SSH_KEY }}

      - name: Push to Scalingo front-${{needs.detect.outputs.target}}
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.email "url@monitor.fr"
          git config --global user.name "URL MONITOR"
          git remote add scalingo git@ssh.osc-fr1.scalingo.com:url-monitor-front-${{needs.detect.outputs.target}}.git
          git fetch scalingo main || true
          git commit --amend -m "chore: deploy $(date +%Y-%m-%d\ %H:%M)" --allow-empty
          git push scalingo HEAD:refs/heads/main --force
  

  scale-up-target-apps:
    name: Scale up apps previously deployed
    runs-on: ubuntu-latest
    needs: [detect, deploy-back, deploy-front]
    #    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Scalingo Bearer
        uses: ./.github/actions/scalingo/exchange-token
        id: exchange_token
        with:
          api_token: ${{ secrets.SCALINGO_API_TOKEN }}

      - name: Scale up backend
        uses: ./.github/actions/scalingo/scale-back
        with:
          bearer_token: ${{ steps.exchange_token.outputs.bearer }}
          target: ${{ needs.detect.outputs.target }}
          web: 1
          worker: 1
          workerInstant: 1

      - name: Scale up frontend
        uses: ./.github/actions/scalingo/scale-front
        with:
          bearer_token: ${{ steps.exchange_token.outputs.bearer }}
          target: ${{ needs.detect.outputs.target }}
          web: 1


  restart-reverse-proxy:
    name: Restart reverse proxy
    runs-on: ubuntu-latest
    needs: [detect, scale-up-target-apps]
#    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait a minute ...
        run: sleep 60

      - name: Get Scalingo Bearer
        uses: ./.github/actions/scalingo/exchange-token
        id: exchange_token
        with:
          api_token: ${{ secrets.SCALINGO_API_TOKEN }}

      - name: Update Scalingo hosts environment variables
        run: |
          jq -n --arg back "url-monitor-back-${{ needs.detect.outputs.target }}.osc-fr1.scalingo.io" \
                --arg front "url-monitor-front-${{ needs.detect.outputs.target }}.osc-fr1.scalingo.io" \
                '{variables:[{name:"BACKEND_HOST",value:$back},{name:"FRONTEND_HOST",value:$front}]}' \
            | curl -H "Accept: application/json" \
                   -H "Content-Type: application/json" \
                   -H "Authorization: Bearer ${{ steps.exchange_token.outputs.bearer }}" \
                   -X PUT https://api.osc-fr1.scalingo.com/v1/apps/url-monitor-reverse-proxy/variables \
                   -d @-

      - name: Restart Scalingo reverse proxy
        run: |
          curl -H "Accept: application/json" \
               -H "Content-Type: application/json" \
               -H "Authorization: Bearer ${{ steps.exchange_token.outputs.bearer }}" \
               -X POST https://api.osc-fr1.scalingo.com/v1/apps/url-monitor-reverse-proxy/restart

  scale-down-old-apps:
    name: Scale down to 0 apps previously alive
    runs-on: ubuntu-latest
    needs: [detect, restart-reverse-proxy]
    #    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait a minute ...
        run: sleep 60

      - name: Get Scalingo Bearer
        uses: ./.github/actions/scalingo/exchange-token
        id: exchange_token
        with:
          api_token: ${{ secrets.SCALINGO_API_TOKEN }}

      - name: Scale down backend
        uses: ./.github/actions/scalingo/scale-back
        with:
          bearer_token: ${{ steps.exchange_token.outputs.bearer }}
          target: ${{ needs.detect.outputs.alive }}
          web: 0
          worker: 0
          workerInstant: 0

      - name: Scale down frontend
        uses: ./.github/actions/scalingo/scale-front
        with:
          bearer_token: ${{ steps.exchange_token.outputs.bearer }}
          target: ${{ needs.detect.outputs.alive }}
          web: 0