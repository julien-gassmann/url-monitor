[supervisord]
nodaemon=true                  ; reste au premier plan (nécessaire pour Scalingo)
logfile=/dev/stdout            ; logs vers stdout → visibles dans Scalingo dashboard
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F             ; -F = foreground
autostart=true
autorestart=true               ; relance si crash
startretries=3
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nextjs]
command=node frontend/.next/standalone/server.js
autostart=true
autorestart=true
startretries=3
environment=PORT=3000,HOSTNAME=127.0.0.1
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -c /app/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0