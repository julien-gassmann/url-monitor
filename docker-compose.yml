services:
  # Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    restart: unless-stopped
    env_file: frontend/.env
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/var/www/html/app
    tty: true

  # Laravel API
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    entrypoint: [ "/entrypoints/backend-entrypoint.sh" ]
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy

  # Generate .blade.php views from .mjml
  mjml:
    image: node:lts
    working_dir: /app
    volumes:
      - ./backend:/app
    profiles:
      - tools

  # Laravel Scheduler
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    entrypoint: [ "/entrypoints/scheduler-entrypoint.sh" ]
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy

  # Laravel Queue Worker (used for periodic checks)
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    entrypoint: [ "/entrypoints/worker-entrypoint.sh" ]
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Laravel Queue Worker (used for instant checks)
  worker_instant:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file: backend/.env
    entrypoint: [ "/entrypoints/worker-instant-entrypoint.sh" ]
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx (Reverse proxy)
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/usr/src/app
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_started

  # MariaDB
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: 'monitoring'
      MARIADB_USER: 'monitoring'
      MARIADB_PASSWORD: 'password'
      MARIADB_ROOT_PASSWORD: 'root'
    ports:
      - '3306:3306'
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis
  redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db:
  redis: